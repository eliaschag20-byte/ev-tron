name: Keep database alive
# El plan gratuito de Supabase pausa proyectos tras 7 días sin actividad: este ping lo evita.
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then echo "Sin secretos configurados: nada que hacer"; exit 0; fi
          curl -fsS "$SUPABASE_URL/rest/v1/explorers?select=id&limit=1" -H "apikey: $SUPABASE_KEY"
