# GitLab Pages: publica index.html, css/, js/ y data/ en cada push a la rama por defecto.
pages:
  stage: deploy
  image: node:20-alpine
  script:
    - sh scripts/check.sh
    - mkdir -p public
    - cp -r index.html css js data public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
